<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="format-detection" content="telephone=no,email=no,address=no" />
    <title>GameRank Tracker</title>
    <link rel="icon" type="image/png" href="/assets/leaderboard-logo.png" />
    <link rel="apple-touch-icon" href="/assets/leaderboard-logo.png" />
    <style>html{background:#f7f9f3}html.dark{background:#000000}.app-boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}.app-boot-stage{display:flex;flex-direction:column;align-items:center;gap:1.25rem}.app-boot-mark{position:relative;display:flex;align-items:center;justify-content:center;width:4.5rem;height:4.5rem;animation:app-boot-lift 2.8s ease-in-out infinite}.app-boot-glow{position:absolute;inset:-50%;border-radius:9999px;opacity:.35;animation:app-boot-breathe 2.8s ease-in-out infinite}.app-boot-logo{position:relative;width:100%;height:100%;object-fit:contain}.app-boot-monogram{position:relative;display:flex;align-items:center;justify-content:center;width:100%;height:100%;border-radius:1.375rem;font-size:1.5rem;font-weight:600;letter-spacing:.02em}.app-boot-title{margin:0;font-size:1.0625rem;font-weight:600;letter-spacing:-.01em}.app-boot-message{margin:0;font-size:.8125rem;letter-spacing:.06em}.app-boot-track{position:relative;width:7rem;height:2px;border-radius:9999px;overflow:hidden}.app-boot-track::after{content:'';position:absolute;top:0;bottom:0;width:40%;border-radius:inherit;animation:app-boot-sweep 1.5s ease-in-out infinite}.app-boot-brand{position:absolute;bottom:2.25rem;display:flex;align-items:center;gap:.4375rem;opacity:.55;font-size:.75rem;letter-spacing:.03em}.app-boot-brand svg{width:.875rem;height:.875rem;border-radius:2px}@keyframes app-boot-breathe{0%,100%{opacity:.28;transform:scale(.9)}50%{opacity:.7;transform:scale(1.08)}}@keyframes app-boot-lift{0%,100%{transform:scale(.96);opacity:.85}50%{transform:scale(1.04);opacity:1}}@keyframes app-boot-sweep{0%{transform:translateX(-110%)}100%{transform:translateX(360%)}}@media (prefers-reduced-motion:reduce){.app-boot-glow,.app-boot-mark,.app-boot-track::after{animation-duration:6s}}html .app-boot{background:#f7f9f3}html .app-boot-glow{background:radial-gradient(circle,#e96b15 0%,transparent 68%)}html .app-boot-logo,html .app-boot-monogram{filter:drop-shadow(0 0 16px color-mix(in srgb,#e96b15 45%,transparent))}html .app-boot-monogram{background:#e96b15;color:#000000}html .app-boot-title{color:#000000}html .app-boot-message{color:#333333}html .app-boot-track{background:color-mix(in srgb,#000000 12%,transparent)}html .app-boot-track::after{background:#e96b15}html .app-boot-brand{color:#333333}html.dark .app-boot{background:#000000}html.dark .app-boot-glow{background:radial-gradient(circle,#F97316 0%,transparent 68%)}html.dark .app-boot-logo,html.dark .app-boot-monogram{filter:drop-shadow(0 0 16px color-mix(in srgb,#F97316 45%,transparent))}html.dark .app-boot-monogram{background:#F97316;color:#000000}html.dark .app-boot-title{color:#ffffff}html.dark .app-boot-message{color:#cccccc}html.dark .app-boot-track{background:color-mix(in srgb,#ffffff 12%,transparent)}html.dark .app-boot-track::after{background:#F97316}html.dark .app-boot-brand{color:#cccccc}</style>
    <link rel="stylesheet" href="/src/styles.css" />
    <script>(function(){var stored=localStorage.getItem('lsai:theme');var dark=stored?stored==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.classList.toggle('dark',dark);})();</script>
  </head>
  <body class="bg-background text-foreground">
    <div id="root"><div class="app-boot" role="status" aria-label="Loading…"><div class="app-boot-stage"><div class="app-boot-mark"><span class="app-boot-glow"></span><img class="app-boot-logo" src="assets/leaderboard-logo.png" alt="" /></div><p class="app-boot-title">GameRank Tracker</p><p class="app-boot-message">Loading…</p><span class="app-boot-track"></span></div><div class="app-boot-brand"><svg viewBox="0 0 100 100" aria-hidden="true"><path d="M 0 0 L 44 0 L 44 26 L 26 26 L 26 44 L 0 44 Z" fill="#00D9FF" /><path d="M 56 0 L 100 0 L 100 44 L 74 44 L 74 26 L 56 26 Z" fill="#00C4FF" /><path d="M 0 56 L 26 56 L 26 74 L 44 74 L 44 100 L 0 100 Z" fill="#0099FF" /><path d="M 74 56 L 100 56 L 100 100 L 56 100 L 56 74 L 74 74 Z" fill="#0077FF" /></svg><span>Lightscale AI</span></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
